<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Interactive expanding Spider-Man character cards with textured backgrounds, pulse animation and AOS scroll effects.">
    <link rel="stylesheet" href="animation.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css">
    <title>Expanding Character Cards</title>
</head>
<body>
    <main class="main">
        <article class="superhero-card red-card"
            data-aos="slide-right"
            data-aos-offset="200"
            data-aos-delay="500"
            data-aos-duration="1000"
            data-aos-easing="ease-in-out-quart"
            data-aos-mirror="false"
            data-aos-once="false"
            data-aos-anchor-placement="center">
            <div class="superhero-circle">
                <img src="images/GlossyRedSymbioteSpiderEmblem.png" class="hero-logo animotion-pulse" alt="Glossy red spider emblem">
            </div>
            <div class="hero-content">
                <h2>Spider Man</h2>
                <p>The classic red-and-blue web-slinger presented in an expanding interactive character card.</p>
                <a href="#" aria-label="Explore Spider-Man card">Explore</a>
            </div>
            <img src="images/spiderman-red.png" class="hero-product" alt="Red Spider-Man character">
        </article>

        <article class="superhero-card black-card"
            data-aos="slide-left"
            data-aos-offset="200"
            data-aos-delay="500"
            data-aos-duration="1000"
            data-aos-easing="ease-in-out-quart"
            data-aos-mirror="false"
            data-aos-once="false"
            data-aos-anchor-placement="center">
            <div class="superhero-circle">
                <img src="images/GlossyBlackSymbioteSpiderEmblem.png" class="hero-logo animotion-pulse" alt="Glossy black spider emblem">
            </div>
            <div class="hero-content">
                <h2>Black Spider Man</h2>
                <p>The black-suit web-slinger with a dark symbiote look and the same expanding card interaction.</p>
                <a href="#" aria-label="Explore Black Spider-Man card">Explore</a>
            </div>
            <img src="images/spiderman-black.png" class="hero-product" alt="Black suit Spider-Man character">
        </article>
    </main>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
        AOS.init();
    </script>
</body>
</html>
