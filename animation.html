<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="animation.css">
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <title>Animation Effect</title>
</head>
<body>
    <div class="main" >
        <div class="superhero-card" data-aos="slide-right"
        data-aos-offset="200"
        data-aos-delay="500"
        data-aos-duration="1000"
        data-aos-easing="ease-in-out-quart"
        data-aos-mirror="false"
        data-aos-once="false"
        data-aos-anchor-placement="center">
            <div class="superhero-circle" style="--hero_clr:#f40103">
                <img src="images/spider.png" class="hero-logo rotate" alt="logo">
            </div>
            <div class="hero-content">
                <h2>Spider Man</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quam esse quasi quas sapiente necessitatibus enim officiis asperiores? </p>
                <a href="#">Explore</a>
            </div>
            <img src="images/spiderman.png" class="hero-product">
        </div>

        <div class="superhero-card" data-aos="slide-left"
        data-aos-offset="200"
        data-aos-delay="500"
        data-aos-duration="1000"
        data-aos-easing="ease-in-out-quart"
        data-aos-mirror="false"
        data-aos-once="false"
        data-aos-anchor-placement="center">
            <div class="superhero-circle" style="--hero_clr:#000">
                <img src="images/bat.png" class="hero-logo rotate2" alt="logo">
            </div>
            <div class="hero-content">
                <h2>Bat Man</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Quam esse quasi quas sapiente necessitatibus enim officiis asperiores? </p>
                <a href="#">Explore</a>
            </div>
            <img src="images/batman.png" class="hero-product">
        </div>
    </div>

    <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
    <script>
    AOS.init();
    </script>

</body>
</html>
